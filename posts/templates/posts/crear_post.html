{% extends "base.html" %}

{% block title %}
Crear post
{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">

    <div class="card shadow-sm">
      <div class="card-body">

        <h2 class="mb-4">
          Crear nueva publicación
        </h2>

        <form method="POST" enctype="multipart/form-data">

          {% csrf_token %}

          {{ form.as_p }}

          <button type="submit" class="btn btn-primary">
            Crear post
          </button>

          <a
            href="{% url 'lista_posts' %}"
            class="btn btn-secondary"
          >
            Cancelar
          </a>

        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
