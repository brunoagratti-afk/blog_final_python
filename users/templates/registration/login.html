{% extends "base.html" %}

{% block title %}
Iniciar sesión
{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">

    <div class="card shadow-sm">
      <div class="card-body">

        <h2 class="mb-4">
          Iniciar sesión
        </h2>

        <form method="POST">

          {% csrf_token %}

          {{ form.as_p }}

          <button type="submit" class="btn btn-primary w-100">
            Iniciar sesión
          </button>

        </form>

        <p class="mt-3 text-center">
          ¿No tenés cuenta?
          <a href="{% url 'registro' %}">
            Registrate
          </a>
        </p>

      </div>
    </div>

  </div>
</div>

{% endblock %}
