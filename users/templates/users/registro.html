{% extends "base.html" %}

{% block title %}
Registro
{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body">

        <h2 class="mb-4">
          Crear cuenta
        </h2>

        <form method="POST">

          {% csrf_token %}

          {{ form.as_p }}

          <button type="submit" class="btn btn-primary w-100">
            Registrarse
          </button>

        </form>

        <p class="mt-3 text-center">
          ¿Ya tenés cuenta?
          <a href="{% url 'login' %}">
            Iniciar sesión
          </a>
        </p>

      </div>
    </div>

  </div>
</div>

{% endblock %}
